name: Deploy static portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          site_dir=.
          if [ -f portfolio/index.html ]; then site_dir=portfolio; fi
          mkdir _site
          cp "$site_dir"/index.html _site/index.html
          cp "$site_dir"/profile-photo-1.jpeg "$site_dir"/profile-photo-2.jpeg "$site_dir"/profile-photo-3.jpeg "$site_dir"/Dharankumar_Resume.pdf _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
